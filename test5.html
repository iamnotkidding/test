<!DOCTYPE html>
<html>
<head>
    <title>WebGL 1.0 GPU Load Test (Single File)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gpuCanvas"></canvas>

    <script>
        // WebGL 셰이더 소스 (GLSL ES 1.00)

        // 1. 정점 셰이더 (Vertex Shader): 화면 전체 사각형을 정의합니다.
        const vsSource = `
            attribute vec2 a_position;
            varying vec2 v_texCoord;
            
            void main() {
                // gl_Position은 클립 공간(-1.0 ~ 1.0) 좌표를 정의합니다.
                gl_Position = vec4(a_position, 0.0, 1.0);
                // 텍스처 좌표는 프래그먼트 셰이더로 전달됩니다. (0.0 ~ 1.0)
                v_texCoord = (a_position + 1.0) / 2.0;
            }
        `;

        // 2. 프래그먼트 셰이더 (Fragment Shader): 계산 로드를 발생시킵니다.
        const fsSource = `
            precision highp float; // 모바일 장치에서 높은 정밀도로 계산 (부하 증가)

            uniform float u_time; // 시간 유니폼
            varying vec2 v_texCoord; // 화면 좌표 (0.0 ~ 1.0)

            // 복잡한 반복 계산을 수행하여 ALU에 부하를 줍니다.
            // Mandelbrot Set 계산과 유사한 구조입니다.
            vec3 high_compute_load(vec2 uv, float t) {
                // uv를 -2.0 ~ 2.0 범위로 확장하고 화면 비율을 보정합니다.
                float aspect = 800.0 / 600.0; // 캔버스 비율에 따라 변경 필요
                vec2 c = (uv - 0.5) * vec2(4.0 * aspect, 4.0);
                
                // 시간 변화에 따라 확대/축소/이동을 추가하여 연산 변동성을 줍니다.
                c.x += sin(t * 0.1) * 0.5;
                c.y += cos(t * 0.15) * 0.5;

                vec2 z = c;
                float i;
                
                // **반복 횟수 (Iterations)를 늘릴수록 GPU 계산 부하가 급증합니다.**
                // 모바일 GPU의 성능에 따라 이 값을 조절하십시오. (예: 50 ~ 200)
                int maxIterations = 100; 

                for (i = 0.0; i < float(maxIterations); i += 1.0) {
                    z = vec2(
                        z.x * z.x - z.y * z.y + c.x, // 복소수 제곱 연산
                        2.0 * z.x * z.y + c.y
                    );
                    
                    // 절댓값과 제곱 연산을 통해 연산 부하를 유지합니다.
                    if (dot(z, z) > 4.0) break;
                }
                
                // 반복 횟수를 색상으로 변환하여 시각화합니다.
                float colorValue = i / float(maxIterations);
                
                // 삼각 함수를 사용하여 최종 색상을 계산하여 추가 부하를 줍니다.
                return vec3(
                    sin(colorValue * 15.0 + t),
                    cos(colorValue * 20.0),
                    sin(colorValue * 10.0 + 3.0)
                );
            }

            void main() {
                // 최종 색상 계산 (GPU 부하 발생)
                vec3 finalColor = high_compute_load(v_texCoord, u_time);
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        let gl;
        let programInfo;
        let buffers;
        let startTime = 0;

        /**
         * WebGL Context를 초기화하고 셰이더를 설정합니다.
         */
        function initWebGL() {
            const canvas = document.getElementById('gpuCanvas');
            
            // 캔버스 크기를 화면 전체로 설정 (모바일 장치에 맞춤)
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // WebGL 1.0 컨텍스트를 가져옵니다.
            gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

            if (!gl) {
                alert('웹 브라우저가 WebGL 1.0을 지원하지 않습니다.');
                return;
            }

            const shaderProgram = initShaderProgram(gl, vsSource, fsSource);
            
            programInfo = {
                program: shaderProgram,
                attribLocations: {
                    position: gl.getAttribLocation(shaderProgram, 'a_position'),
                },
                uniformLocations: {
                    time: gl.getUniformLocation(shaderProgram, 'u_time'),
                },
            };

            buffers = initBuffers(gl);
            
            // 캔버스 크기 변경 시 처리를 위한 리사이즈 이벤트
            window.addEventListener('resize', onResize);
            // 초기 화면 비율을 셰이더에 전달할 수 있도록 렌더링 시작
            requestAnimationFrame(render); 
        }

        /**
         * 셰이더 컴파일 및 프로그램 연결
         */
        function initShaderProgram(gl, vsSource, fsSource) {
            const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);

            const shaderProgram = gl.createProgram();
            gl.attachShader(shaderProgram, vertexShader);
            gl.attachShader(shaderProgram, fragmentShader);
            gl.linkProgram(shaderProgram);

            if (!gl.getProgramParameter(shaderProgram, gl.LINK_STATUS)) {
                console.error('셰이더 프로그램 링크 실패:', gl.getProgramInfoLog(shaderProgram));
                return null;
            }
            return shaderProgram;
        }

        /**
         * 셰이더 소스를 컴파일합니다.
         */
        function loadShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('셰이더 컴파일 에러:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        /**
         * 화면 전체를 덮는 사각형(Quad) 버퍼를 초기화합니다.
         */
        function initBuffers(gl) {
            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

            // 화면을 덮는 두 개의 삼각형 (클립 공간 좌표)
            const positions = [
                -1.0, -1.0,  // Bottom Left
                 1.0, -1.0,  // Bottom Right
                -1.0,  1.0,  // Top Left
                 1.0,  1.0,  // Top Right
            ];

            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

            return { position: positionBuffer };
        }
        
        /**
         * 캔버스 크기 변경 시 뷰포트를 업데이트합니다.
         */
        function onResize() {
            const canvas = gl.canvas;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        /**
         * 렌더링 루프
         */
        function render(now) {
            if (startTime === 0) startTime = now;
            const timeElapsed = (now - startTime) / 1000; // 초 단위

            // 1. 뷰포트 설정 (onResize에서 이미 처리됨)
            
            // 2. 버퍼 초기화
            gl.clearColor(0.0, 0.0, 0.0, 1.0); 
            gl.clear(gl.COLOR_BUFFER_BIT);

            // 3. 프로그램 사용
            gl.useProgram(programInfo.program);

            // 4. 유니폼 설정
            gl.uniform1f(programInfo.uniformLocations.time, timeElapsed);
            
            // 프래그먼트 셰이더의 화면 비율 계산을 위해 셰이더를 다시 컴파일/업데이트할 필요 없이
            // u_time에 간접적으로 정보를 전달하거나, 별도의 유니폼을 추가할 수 있습니다.
            // (이 예시에서는 계산 부하 테스트에 집중하기 위해 고정된 비율을 사용했습니다.)

            // 5. 정점 버퍼 바인딩
            {
                const numComponents = 2;  // x, y
                const type = gl.FLOAT;    // 32비트 부동 소수점
                const normalize = false;
                const stride = 0;
                const offset = 0;

                gl.bindBuffer(gl.ARRAY_BUFFER, buffers.position);
                gl.vertexAttribPointer(
                    programInfo.attribLocations.position,
                    numComponents,
                    type,
                    normalize,
                    stride,
                    offset
                );
                gl.enableVertexAttribArray(programInfo.attribLocations.position);
            }

            // 6. 드로우 콜 (화면 전체 사각형)
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); 

            // 7. 다음 프레임 요청
            requestAnimationFrame(render);
        }

        window.onload = initWebGL;
    </script>
</body>
</html>
